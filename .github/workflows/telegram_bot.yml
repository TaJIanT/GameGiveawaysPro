name: Telegram Auto Poster

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  post_giveaways:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests customtkinter pillow pystray

      - name: Запуск Telegram Бота
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python telegram_poster.py

      - name: Сохранение памяти (кэша) бота
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add notification_history.json
          git commit -m "🤖 Бот: обновление базы отправленных игр" || exit 0
          git push
